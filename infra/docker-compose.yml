name: ${COMPOSE_PROJECT_NAME:-calf-wrapper}

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: calf-wrapper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${CALF_WRAPPER_DATA_ROOT:-./.dockerdata}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [calf-wrapper]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: calf-wrapper-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - ${MINIO_API_PORT:-9030}:9000
      - ${MINIO_CONSOLE_PORT:-9031}:9001
    volumes:
      - ${CALF_WRAPPER_DATA_ROOT:-./.dockerdata}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [calf-wrapper]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: calf-wrapper-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set wrapper http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "wrapper/$${MINIO_BUCKET}"
    networks: [calf-wrapper]

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: calf-wrapper-mlflow:2.20.0
    container_name: calf-wrapper-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    command:
      - /bin/sh
      - -ec
      - >-
        mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql+psycopg2://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}
        --artifacts-destination s3://$${MINIO_BUCKET}
        --serve-artifacts
    ports:
      - ${MLFLOW_PORT:-5001}:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [calf-wrapper]

networks:
  calf-wrapper:
    name: calf-wrapper-network
