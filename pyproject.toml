[project]
name = "calfwrapper"
version = "0.1.0"
description = "CALF-Wrapper implementation and reproducibility toolkit"
authors = [
    {name = "Anton Bolychev",email = "bolychev.anthon@yandex.ru"},
    {name = "Georgiy Malaniya", email = "pwlsd.gm@gmail.com"},
    {name = "Grigoriy Yaremenko", email = "grigory.yaremenko@skoltech.ru"},
    {name = "Anastasia Krasnaya", email = "an.krasnaya@gmail.com"},
    {name = "Pavel Osinenko",email = "osinenko.pavel@yandex.ru"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "stable-baselines3==2.3.2",
    "torch==2.5.1",
    "numpy==2.1.3",
    "gymnasium[mujoco]==0.29.0",
    "matplotlib==3.9.2",
    "mlflow==2.20.0",
    "scipy==1.14.1",
    "pygame==2.6.1",
    "tyro==0.9.13",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff>=0.12.0",
    "ty>=0.0.1a19",
]

[project.scripts]
calfwrapper = "calfwrapper.cli:main"

[tool.poetry]
packages = [
    { include = "calfwrapper" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
